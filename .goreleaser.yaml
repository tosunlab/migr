# Release builds (M14-T1). Tagging vX.Y.Z on main runs .github/workflows/release.yml, which
# runs this. The binary is pure Go -- SQLite is modernc.org/sqlite -- so CGO stays off and all six
# targets cross-compile from one Linux runner.
#
# The archive names below are a contract: the Homebrew tap, the npm wrapper and the Docker image
# (M14-T2..T4) download them by name.

version: 2

project_name: migrasyon

before:
  hooks:
    - go mod tidy -diff
    # Shell completions ship in every archive, so the Homebrew cask installs them and no user's machine
    # has to run the binary to make them. Hooks are not run through a shell, hence sh -c.
    - sh -c 'mkdir -p completions && go run ./cmd/migrasyon completion bash > completions/migrasyon.bash && go run ./cmd/migrasyon completion zsh > completions/_migrasyon && go run ./cmd/migrasyon completion fish > completions/migrasyon.fish'

builds:
  - id: migrasyon
    main: ./cmd/migrasyon
    binary: migrasyon
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    # The v keeps the form `make build` stamps from git describe; the commit still comes from the
    # go tool's VCS stamping.
    ldflags:
      - -s -w -X github.com/tosunlab/migrasyon/internal/version.Version=v{{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: migrasyon
    ids: [migrasyon]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Stamped with the commit's time, as the binary is, so one tag always produces the same archive.
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"
      - src: completions/*
        info:
          mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Keyless: cosign signs with a certificate Sigstore issues against the release job's GitHub OIDC token,
# so there is no key to keep. Signing the checksum file covers every archive through its hash.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --yes
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}

# The images (M14-T4), both for linux/amd64 and linux/arm64 on ghcr.io: the minimal one
# for .sql projects, and one on Node for TypeScript projects. `latest` and `latest-node` move only on
# a final release; an empty tag is dropped.
dockers_v2:
  - id: minimal
    ids: [migrasyon]
    dockerfile: docker/Dockerfile
    images: [ghcr.io/tosunlab/migrasyon]
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    labels: &labels
      org.opencontainers.image.source: https://github.com/tosunlab/migrasyon
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.title: migrasyon
  - id: node
    ids: [migrasyon]
    dockerfile: docker/node.Dockerfile
    images: [ghcr.io/tosunlab/migrasyon]
    tags:
      - "{{ .Version }}-node"
      - "{{ if not .Prerelease }}latest-node{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    labels: *labels

# Each image is signed keyless as the checksum file is, by its digest, in the transparency log.
docker_signs:
  - cmd: cosign
    artifacts: manifests
    args:
      - sign
      - --yes
      - ${artifact}@${digest}

# The tap behind `brew install tosunlab/tap/migrasyon` (M14-T2): a cask, since goreleaser deprecated
# the formula generator, committed to tosunlab/homebrew-tap with a token scoped to that repository alone.
# A pre-release never reaches it, and a snapshot only writes it under dist/homebrew.
homebrew_casks:
  - name: migrasyon
    ids: [migrasyon]
    binaries: [migrasyon]
    homepage: https://github.com/tosunlab/migrasyon
    description: Polyglot, database-agnostic schema migrations, safe on a live database
    license: MIT
    completions:
      bash: completions/migrasyon.bash
      zsh: completions/_migrasyon
      fish: completions/migrasyon.fish
    repository:
      owner: tosunlab
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    commit_author:
      name: migrasyon-release
      email: migrasyon-release@users.noreply.github.com
    commit_msg_template: "migrasyon {{ .Tag }}"
    skip_upload: auto
    # The binary is not notarized, and Homebrew carries a download's quarantine onto the binary,
    # so Gatekeeper would refuse its first run. Written as postflight_steps by hand: goreleaser's hooks
    # render a `postflight` block, which Homebrew 7 deprecates with a warning on every load of the cask.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "migrasyon"], chdir: "."
        end
      end

# sdk/go is a module of its own, tagged sdk/go/vX.Y.Z; none of those is a release of this binary.
git:
  ignore_tags:
    - "sdk/*"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\([^)]*\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\([^)]*\))?!?:'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - '^docs(\([^)]*\))?:'
      - '^test(\([^)]*\))?:'
      - '^chore(\([^)]*\))?:'

release:
  github:
    owner: tosunlab
    name: migrasyon
  prerelease: auto
  draft: false
